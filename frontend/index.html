<!DOCTYPE html>
<html lang="en">
<head>
    <title>WeKnora</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="renderer" content="webkit">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="keywords" content="知识问答、微信对话开放平台、对话开放平台、对话平台、人工智能定制、人机对话、智能问答、人机交互、自然语言处理、自然语言理解、NLP、人工智能产品、人工智能开源、人工智能算法、语音助手"/>
    <meta name="description" content="WeKnora是一款基于大语言模型的文档理解与语义检索框架，专为结构复杂、内容异构的文档场景而打造。"/>
    <link rel="shortcut icon" type="image/png" href="./public/favicon.ico"/>
    <link rel="apple-touch-icon" sizes="120x120" type="image/png" href="./public/favicon.ico"/>
</head>
<body>
<script>
(function(){
  /* 首屏只做一件事：在样式表到达之前先把主题属性写上去，避免整页白闪。
     顺序与 composables/preferenceStorage.ts 一致：先读当前用户命名空间，
     再回落到旧的无命名空间键。 */
  function readTheme(){
    try{
      var raw=localStorage.getItem('weknora_user');
      if(raw){
        var user=JSON.parse(raw);
        if(user&&user.id){
          var scoped=localStorage.getItem('WeKnora_'+user.id+'_theme');
          if(scoped)return scoped;
        }
      }
    }catch(e){}
    return localStorage.getItem('WeKnora_theme')||'light';
  }
  var t=readTheme();
  if(t==='system')t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  /* 护眼模式以 light 为基底，靠 data-vision="eye" 挂载暖色令牌（见 theme.css） */
  var eye=t==='eye';
  document.documentElement.setAttribute('theme-mode',t==='dark'?'dark':'light');
  if(eye)document.documentElement.setAttribute('data-vision','eye');
  /* 与 theme.css 中 --td-bg-color-page 一致，避免样式加载后整页背景跳色触发重绘闪动 */
  var bg=t==='dark'?'#181818':(eye?'#eae4d0':'#eee');
  document.documentElement.style.background=bg;
  document.documentElement.style.minHeight='100%';
  document.documentElement.style.colorScheme=t==='dark'?'dark':'light';
  document.body.style.background=bg;
  document.body.style.minHeight='100%';
  try{
    var w=window.runtime;
    if(w){
      if(t==='dark'){
        if(w.WindowSetDarkTheme)w.WindowSetDarkTheme();
        if(w.WindowSetBackgroundColour)w.WindowSetBackgroundColour(24,24,24,255);
      }else{
        if(w.WindowSetLightTheme)w.WindowSetLightTheme();
        if(w.WindowSetBackgroundColour)w.WindowSetBackgroundColour.apply(w,eye?[234,228,208,255]:[238,238,238,255]);
      }
    }
  }catch(_){}
})();
</script>
<script>
(function(){
  try {
    if (localStorage.getItem('weknora_lite_mode') !== 'true') return;
    var saved = sessionStorage.getItem('weknora_lite_last_path');
    if (!saved || saved.indexOf('/platform/') !== 0 || saved.indexOf('/platform/organizations') === 0) return;
    var path = window.location.pathname;
    if (path !== '/' && path !== '/platform' && path !== '/platform/knowledge-bases') return;
    var target = saved.indexOf('#') >= 0 ? saved.slice(0, saved.indexOf('#')) : saved;
    if (!target) return;
    var current = window.location.pathname + window.location.search;
    if (target !== current) window.history.replaceState(window.history.state, '', target);
  } catch (e) {}
})();
</script>
<script src="%BASE_URL%config.js"></script>
<!--
  离线部署兼容：提前本地加载 tdesign-icons SVG sprite，避免 tdesign-vue-next 的
  <t-icon> 运行时向 https://tdesign.gtimg.com 发起请求（见 issue #867 / #897）。
  升级 tdesign-icons-vue-next 时需同步更新 public/tdesign-icons/<version>/fonts/index.js。
-->
<script src="%BASE_URL%tdesign-icons/0.4.1/fonts/index.js"></script>
<div id="app"></div>
<script>
(function(){
  /* 复用上一个脚本算好的主题属性，避免两处各读一次存储、口径不一致 */
  var root=document.documentElement;
  var eye=root.getAttribute('data-vision')==='eye';
  var bg=root.getAttribute('theme-mode')==='dark'?'#181818':(eye?'#eae4d0':'#eee');
  var el=document.getElementById('app');
  if(el){ el.style.background=bg; el.style.minHeight='100%'; }
})();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
